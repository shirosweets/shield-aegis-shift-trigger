name: Repository Security Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Actions (Actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # Scans both action.yml and .github/workflows/*.yml
          actionlint_flags: -color

  shellcheck:
    name: Lint Bash Scripts (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          severity: 'error' # Fails the pipeline only on severe Bash errors

  secret-scan:
    name: Scan for Secrets (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required to scan the entire git history

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e #v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  self-dogfooding:
      name: Shield Aegis Shift Trigger Self-Scan
      runs-on: ubuntu-latest
      needs: [actionlint, shellcheck, secret-scan] # Espera a que los linters pasen primero
      steps:
        - name: Checkout code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - name: Security Scan via Local Action
          # El './' le indica a GitHub que consuma el action.yml de este mismo repositorio
          uses: ./
          with:
            target_dir: '.'
            exclude_dirs: 'tests/fixtures'
            # Reglas específicas para asegurar scripts de Bash y GitHub Actions
            semgrep_rules: 'r/bash p/github-actions p/security-audit'
            trivy_severity: 'HIGH,CRITICAL'
            blocking: 'true'

  integration-tests:
      name: Input Variations Tests
      runs-on: ubuntu-latest
      needs: [actionlint, shellcheck, secret-scan]
      steps:
        - name: Checkout code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - name: Test Audit Mode (Non-Blocking)
          uses: ./
          with:
            target_dir: '.'
            exclude_dirs: 'tests/fixtures'
            blocking: 'false'
            ignore_unfixed: 'true'

        - name: Test Specific Scanners Isolation
          uses: ./
          with:
            target_dir: '.'
            exclude_dirs: 'tests/fixtures'
            trivy_scanners: 'misconfig' # Fuerza a Trivy a ignorar vulnerabilidades y solo evaluar IaC
            blocking: 'true'